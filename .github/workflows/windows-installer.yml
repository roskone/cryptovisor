name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы прикладывать установщик к релизу

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/cryptovisor.spec --noconfirm --clean

      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CryptoVisor-Setup
          path: dist/CryptoVisor-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CryptoVisor-Setup-*.exe
